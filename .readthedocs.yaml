# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The docs are Sphinx + MyST, so every page is Markdown -- the same markup the
# specifications and the constitution are already written in. A fact can move between
# `specs/` and `docs/` without being translated on the way.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

  # A broken cross-reference or a page missing from a toctree fails the build rather
  # than shipping. Documentation that quietly rots is worse than none, because it is
  # still believed.
  fail_on_warning: true

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/requirements.txt
